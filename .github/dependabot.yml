version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      tooling:
        patterns:
          - '@types/*'
          - oxlint
          - prettier
          - typescript

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      non-majors:
        update-types:
          - minor
          - patch
