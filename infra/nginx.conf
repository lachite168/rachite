upstream rachite_api {
    zone rachite_api 64k;
    # Docker's embedded DNS tracks the API container across replacements.
    resolver 127.0.0.11 valid=5s;
    server api:3000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://rachite_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /swagger-ui {
        proxy_pass http://rachite_api;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
