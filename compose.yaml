services:
  api:
    build:
      context: .
      target: api
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RUST_LOG: ${RUST_LOG:-starter_api=info,tower_http=info}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - sqlite-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:3000/api/health'
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  sqlite-data:
